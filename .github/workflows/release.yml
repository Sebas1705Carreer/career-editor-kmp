name: Release

# One tag produces the desktop installers (Windows, macOS, Linux), attached to a single
# release. This repository is public, so nothing that embeds the API token may go here: the
# Android APK is built by release-apk.yml and distributed through Firebase App Distribution.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and publish.
        required: true
        type: string

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            format: msi
          - os: macos-latest
            format: dmg
          - os: ubuntu-latest
            format: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The executable bit is set in the repository, but a checkout that loses it
      # fails with a bare "Permission denied" that says nothing about the cause.
      - name: Build installer
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:packageDistributionForCurrentOS --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.format }}
          path: composeApp/build/compose/binaries/main/${{ matrix.format }}/*
          if-no-files-found: error

  publish:
    needs: [desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          ls -la dist
          gh release create "$tag" dist/* \
            --title "Folio $tag" \
            --generate-notes
