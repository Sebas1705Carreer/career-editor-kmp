name: Tests

# Unit tests only (commonTest, run as Android local unit tests): no token, no Doppler, nothing
# leaves the runner. The signed APK is built by release-apk.yml on tags.
on:
  push:
    branches: [development, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Run the unit tests
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:testDebugUnitTest --no-daemon

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: composeApp/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
