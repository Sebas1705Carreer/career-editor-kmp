name: Tests

# Unit tests only (commonTest, run as Android local unit tests): no token, no Doppler, nothing
# leaves the runner. The signed APK is built by release-apk.yml on tags.
on:
  push:
    branches: [development, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run the unit tests
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:testDebugUnitTest --no-daemon

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-report
          path: composeApp/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
